name: Build XHookLab
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK & NDK
        run: |
          set -x
          SDK="$ANDROID_SDK_ROOT"
          echo "SDK=$SDK"
          ls "$SDK" || true
          SDKMGR=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "SDKMGR=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMGR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null 2>&1 || true
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.1.10909125" >> $GITHUB_ENV
          ls "$SDK/ndk" || true

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/xhl.keystore \
            -alias xhl \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass xhooklab -keypass xhooklab \
            -dname "CN=XHookLab, OU=Dev, O=XHookLab, L=NA, ST=NA, C=NA"

      - name: Build Release
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XHookLab-apk
          path: app/build/outputs/apk/release/*.apk
