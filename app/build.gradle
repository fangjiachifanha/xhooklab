plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xhooklab'
    compileSdk 34

    defaultConfig {
        applicationId 'com.xhooklab'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c11'
                arguments '-DANDROID_STL=none'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            storeFile file('xhl.keystore')
            storePassword 'xhooklab'
            keyAlias 'xhl'
            keyPassword 'xhooklab'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
